# Pytest Configuration for Sales OS Backend Tests
# ================================================

# Test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Minimum pytest version
minversion = 7.0

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (may require external services)
    e2e: End-to-end tests (full workflow tests)
    slow: Slow tests (> 1 second)
    api: API endpoint tests
    db: Database tests
    spiced: SPICED analysis tests
    content: Content generation tests
    prospect: Prospect enrichment tests
    crm: CRM integration tests
    hubspot: HubSpot specific tests

# Test output formatting
addopts =
    -v
    --tb=short
    --strict-markers
    --strict-config
    -ra
    --color=yes

# Async test support
asyncio_mode = auto

# Coverage configuration
# Run with: pytest --cov=app --cov-report=html --cov-report=xml
# Coverage is configured via pyproject.toml

# Warnings handling
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    error::pytest.PytestUnraisableExceptionWarning

# Timeout for tests (in seconds)
timeout = 30
timeout_method = thread

# Parallel execution (pytest-xdist)
# Run with: pytest -n auto
# Configured via command line for flexibility

# Log settings
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Environment variables for tests
env =
    TESTING=true
    DATABASE_URL=sqlite:///./test.db
    REDIS_URL=redis://localhost:6379/1
